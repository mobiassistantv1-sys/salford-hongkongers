<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>義工服務證明 · Salford Hongkongers</title>
<link rel="icon" href="/assets/shk-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--cream:#fcf8f0;--paper:#fffdf8;--ink:#2b2521;--muted:#6b6258;--magenta:#C00878;--gold:#9c6f0d;--gold-b:#F0B020;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;--sans:"Noto Sans TC","Noto Sans CJK TC","PingFang HK",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e2d6;color:var(--ink);font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:760px;margin:0 auto;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar a,.bar button{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:9px 16px;text-decoration:none;cursor:pointer}
.bar .p{background:var(--magenta);color:#fff;border:0}
.bar .g{background:transparent;border:1.5px solid #b9ad9c;color:var(--ink)}
.msg{max-width:560px;margin:0 auto 20px;background:#fff;border:1px solid #e0d6c8;border-radius:14px;padding:20px;line-height:1.6}
.msg h1{font-size:20px;margin-bottom:6px}.msg p{color:var(--muted)}.msg .n{font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:900;margin:10px 0}
.msg .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.msg .acts button,.msg .acts a{font:inherit;font-weight:700;border-radius:10px;padding:11px 16px;text-decoration:none;cursor:pointer}
.stage{overflow:hidden;margin:0 auto 32px}
/* the certificate: A4 landscape */
.cert{width:297mm;height:210mm;background:var(--paper);position:relative;transform-origin:top left;overflow:hidden;font-family:var(--sans)}
.cert .frame{position:absolute;inset:9mm;border:1.6mm solid var(--magenta);border-radius:2mm}
.cert .frame::after{content:"";position:absolute;inset:2.2mm;border:.4mm solid var(--gold-b)}
.cert .in{position:absolute;inset:18mm 26mm 21mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .logo{height:24mm;width:auto}
.cert .t1{font-family:var(--serif);font-weight:900;font-size:15mm;letter-spacing:2.2mm;line-height:1.05;margin-top:6mm;color:var(--ink)}
.cert .t2{font-family:var(--serif);font-weight:700;font-size:6.2mm;letter-spacing:1.2mm;color:var(--gold);margin-top:2mm;text-transform:uppercase}
.cert .pre{font-size:4mm;color:var(--muted);margin-top:7mm;letter-spacing:.3mm}
.cert .name{font-family:var(--serif);font-weight:900;font-size:13mm;line-height:1.15;margin-top:2.5mm;color:var(--magenta);padding:0 8mm 2mm;border-bottom:.5mm solid var(--gold-b);max-width:220mm;overflow-wrap:anywhere}
.cert .zh{font-family:var(--serif);font-size:4.6mm;line-height:1.75;margin-top:6mm;max-width:232mm;color:var(--ink)}
.cert .en{font-size:3.7mm;line-height:1.6;margin-top:2.5mm;max-width:205mm;color:var(--muted)}
.cert b.h{color:var(--ink);font-weight:700}.cert .nw{white-space:nowrap}
.cert .foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10mm}
.cert .sig{text-align:left}
.cert .sig .line{width:62mm;border-bottom:.35mm solid var(--ink);height:12mm}
.cert .sig b{display:block;font-family:var(--serif);font-size:4.4mm;margin-top:1.8mm}
.cert .sig span,.cert .meta span{display:block;font-size:3.1mm;color:var(--muted);line-height:1.5}
.cert .meta{text-align:right}
.cert .meta b{font-size:3.6mm;font-weight:700}
.cert .badge{display:flex;flex-direction:column;align-items:center}
.cert .badge svg{width:24mm;height:24mm}
.cert .badge b{font-family:var(--serif);font-size:4.4mm;margin-top:1mm}.cert .badge span{font-size:3.1mm;color:var(--muted)}
.cert .legal{position:absolute;left:0;right:0;bottom:14.2mm;text-align:center;font-size:2.6mm;color:#8a8075;letter-spacing:.2mm}
.cert .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:58mm;color:rgba(192,8,120,.07);transform:rotate(-18deg);pointer-events:none;letter-spacing:6mm}
@page{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}
  .bar,.msg{display:none!important}
  .stage{margin:0;width:auto!important;height:auto!important;overflow:visible}
  .cert{transform:none!important}
}
</style>
</head>
<body>
<div class="bar" id="bar"><a class="g" href="/volunteer/me/">← 我的義工帳戶</a></div>
<div id="msg"></div>
<div class="stage" id="stage" hidden><div class="cert" id="cert"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/shk/shk.js"></script>
<script>
(function(){
"use strict";
const S=window.SHK,esc=S.esc;
const $=s=>document.querySelector(s);
const SIGNER={name:"Manson Yiu",zh:"董事",en:"Director"};
const DEMO=new URLSearchParams(location.search).has("sample");

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dEn=k=>{const [y,m,d]=k.split("-");return (+d)+" "+MONTHS[+m-1]+" "+y;};
const dZh=k=>{const [y,m,d]=k.split("-");return y+"年"+(+m)+"月"+(+d)+"日";};
const mEn=k=>{const [y,m]=k.split("-");return MONTHS[+m-1]+" "+y;};
const mZh=k=>{const [y,m]=k.split("-");return y+"年"+(+m)+"月";};

function medal(t){
  return '<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+t.c1+'"/><stop offset="1" stop-color="'+t.c2+'"/></linearGradient></defs>'
    +'<path d="M20 2h9l3 14-9 3zM44 2h-9l-3 14 9 3z" fill="#C00878"/><circle cx="32" cy="38" r="22" fill="url(#cg)" stroke="'+t.c2+'" stroke-width="2"/>'
    +'<path d="M32 25l3.9 7.9 8.7 1.3-6.3 6.1 1.5 8.7-7.8-4.1-7.8 4.1 1.5-8.7-6.3-6.1 8.7-1.3z" fill="#fff" opacity=".92"/></svg>';
}
function certHtml(d){
  const t=S.tierOf(d.minutes);
  const period=d.first&&d.last?(d.first.slice(0,7)===d.last.slice(0,7)?{zh:"於 "+mZh(d.first),en:" in "+mEn(d.first)}:{zh:"於 "+mZh(d.first)+"至"+mZh(d.last)+"期間",en:" between "+mEn(d.first)+" and "+mEn(d.last)}):{zh:"",en:""};
  return (d.sample?'<div class="wm">SAMPLE 範本</div>':'')
   +'<div class="frame"></div>'
   +'<div class="in"><img class="logo" src="/assets/shk-logo-cert.png" alt="Salford Hongkongers CIC">'
   +'<div class="t1">義工服務證明</div><div class="t2">Certificate of Volunteer Service</div>'
   +'<div class="pre">茲證明　This is to certify that</div>'
   +'<div class="name">'+esc(d.name)+'</div>'
   +'<p class="zh">'+period.zh+'，在 Salford Hongkongers CIC 累計參與義工服務 <b class="h nw">'+esc(S.fmtMin(d.minutes))+'</b>。<br>特頒此證，衷心感謝你為香港人社群及 Salford 社區付出時間與心力。</p>'
   +'<p class="en">has given <b class="h nw">'+esc(S.fmtMin(d.minutes,true))+'</b> of volunteer service to Salford Hongkongers CIC'+period.en+'.<br>Thank you for the time and care you have given to Hongkongers and the wider Salford community.</p>'
   +'<div class="foot"><div class="sig"><div class="line"></div><b>'+esc(SIGNER.name)+'</b><span>'+SIGNER.zh+' '+SIGNER.en+'<br>Salford Hongkongers CIC</span></div>'
   +'<div class="badge">'+medal(t)+'<b>'+esc(t.zh)+'</b><span>'+esc(t.en)+'</span></div>'
   +'<div class="meta"><span>證書編號 Certificate No.</span><b>'+esc(d.no)+'</b><span style="margin-top:2mm">發出日期 Date of issue</span><b>'+esc(dZh(d.today))+' · '+esc(dEn(d.today))+'</b></div></div></div>'
   +'<div class="legal">Salford Hongkongers CIC · Community Interest Company registered in England and Wales · Company No. 13877472 · salfordhongkongers.co.uk</div>';
}
function fit(){
  const st=$("#stage"),c=$("#cert");if(st.hidden)return;
  const w=c.offsetWidth,h=c.offsetHeight,s=Math.min(1,(document.documentElement.clientWidth-24)/w);
  c.style.transform="scale("+s+")";st.style.width=(w*s)+"px";st.style.height=(h*s)+"px";
}
function show(d){
  $("#cert").innerHTML=certHtml(d);$("#stage").hidden=false;$("#msg").innerHTML="";
  if(!$("#pr")){const b=document.createElement("button");b.id="pr";b.className="p";b.textContent="列印 / 儲存 PDF  Print or save";b.onclick=()=>window.print();$("#bar").appendChild(b);}
  document.fonts&&document.fonts.ready.then(fit);fit();
}
function note(h){$("#stage").hidden=true;$("#msg").innerHTML='<div class="msg">'+h+'</div>';}
window.addEventListener("resize",fit);

if(DEMO){show({sample:true,name:"Chan Tai Man",minutes:750,first:"2026-03-14",last:"2026-11-01",no:"SHK-VC-2026-SAMPLE",today:S.dateKey()});return;}

firebase.initializeApp(S.FIREBASE);
const auth=firebase.auth(),db=firebase.database();
let pid=null,me=null,H=null;
const full=()=>[me.first,me.surname].map(x=>(x||"").trim()).filter(Boolean).join(" ");
function draw(){
  if(!me){note('<h1>帳戶未完成登記</h1><p>請去 <a href="/volunteer/join/">登記頁</a> 完成。</p>');return;}
  if(H.minutes<S.CERT_MIN){note('<h1>未夠 10 小時</h1><p>你而家累積咗 '+esc(S.fmtMin(H.minutes))+'，滿 10 小時就可以攞義工服務證明。</p><p>You need 10 hours for a certificate.</p>');return;}
  if(!me.cert&&!full()){note('<h1>請先填英文全名</h1><p>證明會用你嘅英文全名（按護照）發出。請去 <a href="/volunteer/me/">我的義工帳戶</a> 填好英文名同英文姓。</p>');return;}
  if(!me.cert){
    note('<h1>確認證明上嘅名字</h1><p>義工服務證明會以呢個名字發出：</p><div class="n">'+esc(full())+'</div><p>發出之後，英文全名唔可以再改。如果唔啱，請先返去修改。<br>Once issued, your full name cannot be changed.</p>'
      +'<div class="acts"><button id="go" style="background:var(--magenta);color:#fff;border:0">確認，發出證明</button><a href="/volunteer/me/" style="border:1.5px solid #b9ad9c;color:var(--ink)">返去修改名字</a></div>');
    $("#go").onclick=async()=>{
      $("#go").disabled=true;
      const no="SHK-VC-"+S.dateKey().slice(0,4)+"-"+auth.currentUser.uid.slice(0,6).toUpperCase();
      try{await db.ref("shk/people/"+pid+"/cert").set({no,name:full(),at:firebase.database.ServerValue.TIMESTAMP});me.cert={no,name:full()};draw();}
      catch(e){$("#go").disabled=false;alert("發出唔到，請再試。");}
    };
    return;
  }
  show({name:me.cert.name||full(),minutes:H.minutes,first:H.first,last:H.last,no:me.cert.no,today:S.dateKey()});
}
note("<p>載入中… Loading…</p>");
auth.onAuthStateChanged(async u=>{
  if(!u||u.isAnonymous){note('<h1>請先登入</h1><p>去 <a href="/volunteer/me/">我的義工帳戶</a> 登入，再返嚟呢頁。</p>');return;}
  try{pid=(await db.ref("shk/uids/"+u.uid).get()).val();if(pid)me=(await db.ref("shk/people/"+pid).get()).val();}catch(e){}
  if(me)H=await S.volunteerHours(db,pid);
  draw();
});
})();
</script>
</body>
</html>
