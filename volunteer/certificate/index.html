<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>義工服務證明信 · Salford Hongkongers</title>
<link rel="icon" href="/assets/shk-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--cream:#fcf8f0;--paper:#fffdf8;--ink:#2b2521;--muted:#6b6258;--magenta:#C00878;--gold:#9c6f0d;--gold-b:#F0B020;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;--sans:"Noto Sans TC","Noto Sans CJK TC","PingFang HK",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e2d6;color:var(--ink);font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:760px;margin:0 auto;padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar a,.bar button{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:9px 16px;text-decoration:none;cursor:pointer}
.bar .p{background:var(--magenta);color:#fff;border:0}
.bar .g{background:transparent;border:1.5px solid #b9ad9c;color:var(--ink)}
.msg{max-width:560px;margin:0 auto 20px;background:#fff;border:1px solid #e0d6c8;border-radius:14px;padding:20px;line-height:1.6}
.msg h1{font-size:20px;margin-bottom:6px}.msg p{color:var(--muted)}.msg .n{font-family:var(--serif);font-size:22px;color:var(--ink);font-weight:900;margin:10px 0}
.msg .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.msg .acts button,.msg .acts a{font:inherit;font-weight:700;border-radius:10px;padding:11px 16px;text-decoration:none;cursor:pointer}
.stage{overflow:hidden;margin:0 auto 32px}
/* the letter: A4 portrait */
.cert{width:210mm;height:297mm;background:#fff;position:relative;transform-origin:top left;overflow:hidden;font-family:"Noto Serif","Noto Serif TC","Noto Serif CJK TC",Georgia,serif;color:var(--ink)}
.cert .top{position:absolute;left:0;right:0;top:0;height:3.2mm;background:var(--magenta)}
.cert .top::after{content:"";position:absolute;left:0;right:0;top:3.2mm;height:1mm;background:var(--gold-b)}
.cert .in{position:absolute;inset:16mm 22mm 18mm}
.cert .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;padding-bottom:6mm;border-bottom:.35mm solid #e6dccd}
.cert .logo{height:19mm;width:auto}
.cert .org{text-align:right;font-family:var(--sans);font-size:2.9mm;line-height:1.55;color:var(--muted)}
.cert .org b{display:block;font-size:3.5mm;color:var(--ink)}
.cert .meta{display:flex;justify-content:space-between;margin-top:11mm;font-family:var(--sans);font-size:3.3mm;color:var(--muted)}
.cert .meta b{color:var(--ink);font-weight:500}
.cert .to{margin-top:11mm;font-size:4.1mm}
.cert h1{font-size:5.2mm;font-weight:700;margin-top:6mm;color:var(--magenta);line-height:1.35}
.cert .body p{font-size:4.1mm;line-height:1.75;margin-top:4.5mm;text-align:left;hyphens:none}
.cert .body p:first-child{margin-top:6mm}
.cert .close{margin-top:9mm;font-size:4.1mm}
.cert .sig{margin-top:4mm}
.cert .sig .line{width:62mm;border-bottom:.35mm solid var(--ink);height:16mm}
.cert .sig b{display:block;font-size:4.2mm;margin-top:2mm}
.cert .sig span{display:block;font-size:3.6mm;color:var(--muted);line-height:1.5}
.cert .legal{position:absolute;left:22mm;right:22mm;bottom:11mm;text-align:center;font-family:var(--sans);font-size:2.6mm;color:#8a8075;border-top:.35mm solid #e6dccd;padding-top:3mm}
.cert .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:900;font-size:40mm;color:rgba(192,8,120,.07);transform:rotate(-30deg);pointer-events:none;letter-spacing:4mm}
@page{size:A4 portrait;margin:0}
@media print{
  body{background:#fff}
  .bar,.msg{display:none!important}
  .stage{margin:0;width:auto!important;height:auto!important;overflow:visible}
  .cert{transform:none!important}
}
</style>
</head>
<body>
<div class="bar" id="bar"><a class="g" href="/volunteer/me/">← 我的義工帳戶</a></div>
<div id="msg"></div>
<div class="stage" id="stage" hidden><div class="cert" id="cert"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/shk/shk.js"></script>
<script>
(function(){
"use strict";
const S=window.SHK,esc=S.esc;
const $=s=>document.querySelector(s);
const SIGNER={name:"Manson Yiu",zh:"董事",en:"Director"};
const DEMO=new URLSearchParams(location.search).has("sample");

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const dEn=k=>{const [y,m,d]=k.split("-");return (+d)+" "+MONTHS[+m-1]+" "+y;};
const dZh=k=>{const [y,m,d]=k.split("-");return y+"年"+(+m)+"月"+(+d)+"日";};
const mEn=k=>{const [y,m]=k.split("-");return MONTHS[+m-1]+" "+y;};
const mZh=k=>{const [y,m]=k.split("-");return y+"年"+(+m)+"月";};

/* "12 hours and 30 minutes" */
function longEn(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h+(h===1?" hour":" hours")+(r?" and "+r+(r===1?" minute":" minutes"):"");}
function certHtml(d){
  const nm=esc(d.name),fn=esc(d.firstName||d.name);
  const when=d.first&&d.last?(d.first.slice(0,7)===d.last.slice(0,7)?"In "+mEn(d.first):"Between "+mEn(d.first)+" and "+mEn(d.last)):"";
  return (d.sample?'<div class="wm">SAMPLE</div>':'')
   +'<div class="top"></div><div class="in">'
   +'<div class="head"><img class="logo" src="/assets/shk-logo-cert.png" alt="Salford Hongkongers CIC">'
   +'<div class="org"><b>Salford Hongkongers CIC</b>Community Interest Company<br>Salford, Greater Manchester<br>salfordhongkongers@gmail.com<br>salfordhongkongers.co.uk</div></div>'
   +'<div class="meta"><span>Ref: <b>'+esc(d.no)+'</b></span><span><b>'+esc(dEn(d.today))+'</b></span></div>'
   +'<div class="to">To whom it may concern</div>'
   +'<h1>Confirmation of Volunteer Service: '+nm+'</h1>'
   +'<div class="body">'
   +'<p>I am writing to confirm that <b>'+nm+'</b> has volunteered with Salford Hongkongers CIC, a community interest company that supports Hongkongers living in Salford and across Greater Manchester.</p>'
   +'<p>'+(when?when+", ":"")+fn+' gave <b>'+esc(longEn(d.minutes))+'</b> of their time to help at our community events and activities.</p>'
   +'<p>Throughout their time with us, '+fn+' has been diligent and conscientious in their work, and has always treated our members, guests and fellow volunteers with sincerity and courtesy.</p>'
   +'<p>We are sincerely grateful to '+fn+' for giving their time freely and for the difference they have made to our community. We are pleased to provide this letter as confirmation of their volunteer service.</p>'
   +'<p>To verify this letter, please contact us at salfordhongkongers@gmail.com, quoting the reference above.</p>'
   +'</div><div class="close">Yours faithfully,</div>'
   +'<div class="sig"><div class="line"></div><b>'+esc(SIGNER.name)+'</b><span>'+SIGNER.en+'<br>Salford Hongkongers CIC</span></div></div>'
   +'<div class="legal">Salford Hongkongers CIC is a Community Interest Company registered in England and Wales, Company No. 13877472.</div>';
}
function fit(){
  const st=$("#stage"),c=$("#cert");if(st.hidden)return;
  const w=c.offsetWidth,h=c.offsetHeight,s=Math.min(1,(document.documentElement.clientWidth-24)/w);
  c.style.transform="scale("+s+")";st.style.width=(w*s)+"px";st.style.height=(h*s)+"px";
}
function show(d){
  $("#cert").innerHTML=certHtml(d);$("#stage").hidden=false;$("#msg").innerHTML="";
  if(!$("#pr")){const b=document.createElement("button");b.id="pr";b.className="p";b.textContent="列印 / 儲存 PDF  Print or save";b.onclick=()=>window.print();$("#bar").appendChild(b);}
  document.fonts&&document.fonts.ready.then(fit);fit();
}
function note(h){$("#stage").hidden=true;$("#msg").innerHTML='<div class="msg">'+h+'</div>';}
window.addEventListener("resize",fit);

if(DEMO){show({sample:true,name:"Tai Man Chan",firstName:"Tai Man",minutes:750,first:"2026-03-14",last:"2026-11-01",no:"SHK-VC-2026-SAMPLE",today:S.dateKey()});return;}

firebase.initializeApp(S.FIREBASE);
const auth=firebase.auth(),db=firebase.database();
let pid=null,me=null,H=null;
const full=()=>[me.first,me.surname].map(x=>(x||"").trim()).filter(Boolean).join(" ");
function draw(){
  if(!me){note('<h1>帳戶未完成登記</h1><p>請去 <a href="/volunteer/join/">登記頁</a> 完成。</p>');return;}
  if(H.minutes<S.CERT_MIN){note('<h1>未夠 10 小時</h1><p>你而家累積咗 '+esc(S.fmtMin(H.minutes))+'，滿 10 小時就可以攞義工服務證明信。</p><p>You need 10 hours for a volunteer letter.</p>');return;}
  if(!me.cert&&!full()){note('<h1>請先填英文全名</h1><p>證明信會用你嘅英文全名（按護照）發出。請去 <a href="/volunteer/me/">我的義工帳戶</a> 填好英文名同英文姓。</p>');return;}
  if(!me.cert){
    note('<h1>確認證明信上嘅名字</h1><p>義工服務證明信會以呢個名字發出：</p><div class="n">'+esc(full())+'</div><p>發出之後，英文全名唔可以再改。如果唔啱，請先返去修改。<br>Once issued, your full name cannot be changed.</p>'
      +'<div class="acts"><button id="go" style="background:var(--magenta);color:#fff;border:0">確認，發出證明信</button><a href="/volunteer/me/" style="border:1.5px solid #b9ad9c;color:var(--ink)">返去修改名字</a></div>');
    $("#go").onclick=async()=>{
      $("#go").disabled=true;
      const no="SHK-VC-"+S.dateKey().slice(0,4)+"-"+auth.currentUser.uid.slice(0,6).toUpperCase();
      try{await db.ref("shk/people/"+pid+"/cert").set({no,name:full(),at:firebase.database.ServerValue.TIMESTAMP});me.cert={no,name:full()};draw();}
      catch(e){$("#go").disabled=false;alert("發出唔到，請再試。");}
    };
    return;
  }
  show({name:me.cert.name||full(),firstName:(me.first||"").trim(),minutes:H.minutes,first:H.first,last:H.last,no:me.cert.no,today:S.dateKey()});
}
note("<p>載入中… Loading…</p>");
auth.onAuthStateChanged(async u=>{
  if(!u||u.isAnonymous){note('<h1>請先登入</h1><p>去 <a href="/volunteer/me/">我的義工帳戶</a> 登入，再返嚟呢頁。</p>');return;}
  try{pid=(await db.ref("shk/uids/"+u.uid).get()).val();if(pid)me=(await db.ref("shk/people/"+pid).get()).val();}catch(e){}
  if(me)H=await S.volunteerHours(db,pid);
  draw();
});
})();
</script>
</body>
</html>
