<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>我的義工帳戶 · Salford Hongkongers</title>
<link rel="icon" href="/assets/shk-logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#FBF7F2;--card:#FFFFFF;--sunk:#F2EBE3;--ink:#1F1A17;--muted:#6E645C;--line:#E6DCD2;--red:#C00878;--red-ink:#FFFFFF;--red-soft:#FBDBED;--ok:#1E7A4C;--ok-soft:#DFF1E7;--amber:#94600A;--amber-soft:#FBEFD5;
  --f:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151211;--card:#201B19;--sunk:#2A2421;--ink:#F3ECE6;--muted:#AFA39A;--line:#3A322D;--red:#E6249A;--red-ink:#1A0F0D;--red-soft:#3A1430;--ok:#54C48B;--ok-soft:#14301F;--amber:#EDB458;--amber-soft:#3A2C10;color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.band{background:var(--red);color:var(--red-ink);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.band-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.band b{font-size:19px;font-weight:900;letter-spacing:.02em}.band small{display:block;font-size:12px;opacity:.85}
.band button{margin-left:auto;background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700}
.wrap{max-width:520px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h1{font-size:22px;margin:0 0 4px;font-weight:900}.card h2{font-size:18px;margin:0 0 8px;font-weight:900}
.card p{margin:4px 0;color:var(--muted)}
label{display:block;font-weight:700;font-size:14.5px;margin:14px 0 4px}label span{font-weight:400;color:var(--muted);font-size:13px}
input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-size:17px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:900;font-size:18px;background:var(--red);color:var(--red-ink);margin-top:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:16px}
.btn.big{padding:22px;font-size:24px}
.btn.green{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.err{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:12px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-weight:700}
.ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:12px;font-weight:900;font-size:18px;text-align:center}
.event{border-left:6px solid var(--red)}
.event .meta{color:var(--muted);font-size:14.5px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.kpi{background:var(--sunk);border-radius:12px;padding:12px}.kpi span{display:block;color:var(--muted);font-size:13px}.kpi b{font-size:28px;font-weight:900}
a{color:var(--red);font-weight:700}
.small{font-size:13px;color:var(--muted)}
.band .logo-chip{background:#fff;border-radius:8px;padding:3px 5px;display:inline-flex;align-items:center;vertical-align:middle;margin-right:8px}.band .logo-chip img{height:26px;display:block}</style>

<style>
.tier{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.medal{width:62px;height:62px;flex:none}
.tier b{display:block;font-size:20px;font-weight:900;line-height:1.2}.tier span{color:var(--muted);font-size:13.5px}
.big{font-size:30px;font-weight:900;line-height:1.1}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.ladder{list-style:none;padding:0;margin:10px 0 0}
.ladder li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.ladder li.on{font-weight:900;color:var(--red)}
.ladder li small{color:var(--muted);font-weight:400}
.saved{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:12px}
input[readonly]{background:var(--sunk);color:var(--muted)}
.notice{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;line-height:1.6}
.band button{white-space:nowrap;flex:none}
</style>
</head>
<body>
<header class="band"><div class="band-in"><span class="logo-chip"><img src="/assets/shk-logo-icon.png" alt="SHK"></span><div><b>我的義工帳戶</b><small>Salford Hongkongers · My volunteer account</small></div><button id="out" data-act="logout" hidden>登出</button></div></header>
<main class="wrap" id="app"><div class="card"><p>載入中… Loading…</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="/shk/shk.js"></script>
<script>
(function(){
"use strict";
const S=window.SHK,esc=S.esc;
firebase.initializeApp(S.FIREBASE);
const auth=firebase.auth(),db=firebase.database();
const $=s=>document.querySelector(s);
let user=null,pid=null,me=null,H=null,ready=false,busy="",err={},ok={};

function medal(t){
  const id="g"+t.min;
  return '<svg class="medal" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+t.c1+'"/><stop offset="1" stop-color="'+t.c2+'"/></linearGradient></defs>'
    +'<path d="M20 2h9l3 14-9 3zM44 2h-9l-3 14 9 3z" fill="#C00878"/><circle cx="32" cy="38" r="22" fill="url(#'+id+')" stroke="'+t.c2+'" stroke-width="2"/>'
    +'<path d="M32 25l3.9 7.9 8.7 1.3-6.3 6.1 1.5 8.7-7.8-4.1-7.8 4.1 1.5-8.7-6.3-6.1 8.7-1.3z" fill="#fff" opacity=".92"/></svg>';
}
const fullName=()=>[me&&me.first,me&&me.surname].map(x=>(x||"").trim()).filter(Boolean).join(" ");
const msg=k=>(err[k]?'<div class="err">'+esc(err[k])+'</div>':'')+(ok[k]?'<div class="saved">'+esc(ok[k])+'</div>':'');

function loginCard(){
  let h='<div class="card"><h1>義工登入</h1><p>用你嘅 WhatsApp 號碼同密碼登入，睇義工時數、義工證同服務證明信。<span class="small"> Sign in to see your hours, level and volunteer letter.</span></p>';
  h+='<form id="lf"><label for="ph">WhatsApp 號碼 <span>Phone</span></label><input id="ph" type="tel" inputmode="tel" autocomplete="username" placeholder="07… 或 852…" required>';
  h+='<label for="pw">密碼 <span>Password</span></label><input id="pw" type="password" autocomplete="current-password" required>';
  h+=msg("login")+'<button class="btn" type="submit"'+(busy==="login"?" disabled":"")+'>'+(busy==="login"?"登入中…":"登入 Sign in")+'</button></form>';
  h+='<p style="margin-top:16px">第一次用？<a href="/volunteer/join/">登記 / 啟用帳戶</a><br><span class="small">First time? Register or activate your account.</span></p>';
  return h+'<p class="small" style="margin-top:10px">唔記得密碼：請聯絡 SHK 負責人重設。Forgot your password? Ask an SHK organiser to reset it.</p></div>';
}
function hoursCard(){
  if(!H)return '<div class="card"><p>計緊時數… Loading hours…</p></div>';
  const m=H.minutes,t=S.tierOf(m),n=S.nextTier(m);
  let h='<div class="card"><h2>我嘅義工時數 My hours</h2>';
  h+='<div class="tier">'+medal(t)+'<div><b>'+esc(t.zh)+'證</b><span>'+esc(t.en)+'</span></div></div>';
  h+='<div class="kpis"><div class="kpi"><span>總服務時間 Total</span><b class="num" style="font-size:22px">'+esc(S.fmtMin(m))+'</b></div><div class="kpi"><span>出席次數 Sessions</span><b class="num">'+H.count+'</b></div></div>';
  if(n){
    const pct=Math.min(100,Math.round((m-t.min)/(n.min-t.min)*100));
    h+='<p style="color:var(--ink);margin-top:4px">再做 <b>'+esc(S.fmtMin(n.min-m))+'</b> 就升到 <b>'+esc(n.zh)+'證</b><br><span class="small">'+esc(S.fmtMin(n.min-m,true))+' to '+esc(n.en)+'</span></p><div class="bar"><i style="width:'+pct+'%"></i></div>';
  }else h+='<p style="color:var(--ink)">你已經係最高級別嘅鑽石義工，多謝你！<span class="small"> You have reached the top level. Thank you!</span></p>';
  if(H.open)h+='<div class="note" style="margin-top:12px">「'+esc(H.open.title)+'」仲未落班打卡，落班之後先計時數。</div>';
  h+='<ul class="ladder">'+S.TIERS.map((x,i)=>{const nx=S.TIERS[i+1];return '<li class="'+(x===t?"on":"")+'"><span>'+esc(x.zh)+'證 <small>'+esc(x.en)+'</small></span><small>'+(nx?(x.min/60)+'–'+(nx.min/60-1)+' 小時 59 分':(x.min/60)+' 小時以上')+'</small></li>';}).join("")+'</ul>';
  return h+'</div>';
}
function certCard(){
  if(!H)return "";
  let h='<div class="card"><h2>義工服務證明信 Volunteer letter</h2>';
  if(H.minutes<S.CERT_MIN){
    h+='<p>累積滿 10 小時義工服務，就可以攞一封義工服務證明信。仲差 <b style="color:var(--ink)">'+esc(S.fmtMin(S.CERT_MIN-H.minutes))+'</b>。</p><p class="small">You can download a volunteer letter once you reach 10 hours.</p>';
  }else if(!fullName()){
    h+='<div class="note">你已經滿 10 小時，可以攞證明信！請先喺下面「個人資料」填好英文名同英文姓（按護照）。</div><p class="small" style="margin-top:8px">Add your full English name below to get your volunteer letter.</p>';
  }else{
    h+='<p>你已經滿 10 小時，多謝你為社區付出！</p><p class="small">You have completed 10+ hours. Thank you!</p><a class="btn" style="text-align:center;text-decoration:none" href="/volunteer/certificate/">睇 / 下載證明信 View letter</a>';
  }
  return h+'</div>';
}
function sessionsCard(){
  if(!H||!H.sessions.length)return "";
  let h='<div class="card"><h2>最近出席 Recent sessions</h2>';
  H.sessions.slice(0,10).forEach(r=>{h+='<div class="row"><span>'+esc(r.date)+' · '+esc(r.title)+'</span><b class="num">'+esc(S.fmtMin(r.min))+'</b></div>';});
  if(H.fromSheet)h+='<p class="small" style="margin-top:8px">總時數包括 SHK 紀錄表入面以前嘅服務時數。Includes hours from SHK records.</p>';
  return h+'</div>';
}
function profileCard(){
  const locked=!!(me&&me.cert);
  let h='<div class="card"><h2>個人資料 My details</h2><form id="pf">';
  h+='<label for="nm">登記名字 <span>Name used at SHK</span></label><input id="nm" type="text" maxlength="60" required value="'+esc(me.name)+'">';
  if(!locked)h+='<div class="notice" style="margin-top:14px"><b>需要義工服務證明信？</b><br>請按護照填寫英文全名（名同姓）。證明信會以你填寫嘅名字發出，發出後恕不更改為護照或其他名字，敬請留意。<span class="small" style="display:block;margin-top:6px">Enter your full English name exactly as on your passport. Volunteer letters are issued in this name and cannot be changed afterwards.</span></div>';
  h+='<label for="fn">英文名 <span>First name</span></label><input id="fn" type="text" maxlength="60" autocomplete="given-name" value="'+esc(me.first)+'"'+(locked?" readonly":"")+'>';
  h+='<label for="sn">英文姓 <span>Surname</span></label><input id="sn" type="text" maxlength="60" autocomplete="family-name" value="'+esc(me.surname)+'"'+(locked?" readonly":"")+'>';
  if(locked)h+='<p class="small" style="margin-top:6px">服務證明信已經以「'+esc(me.cert.name||fullName())+'」發出，英文全名唔可以再改。如有錯漏請聯絡 SHK。<br>Your volunteer letter has been issued, so your full name is locked.</p>';
  h+='<label for="em">電郵 <span>Email (optional)</span></label><input id="em" type="email" maxlength="100" autocomplete="email" value="'+esc(me.email)+'">';
  h+=msg("profile")+'<button class="btn" type="submit"'+(busy==="profile"?" disabled":"")+'>'+(busy==="profile"?"儲存中…":"儲存 Save")+'</button></form></div>';
  return h;
}
function phoneCard(){
  let h='<div class="card"><h2>WhatsApp 號碼 Phone</h2><p>而家用緊：<b class="num" style="color:var(--ink)">'+esc(S.prettyPhone(pid))+'</b>（亦係你嘅登入號碼）</p>';
  if(me.phoneRequest)h+='<div class="note" style="margin-top:10px">已申請改做 '+esc(S.prettyPhone(me.phoneRequest.phone))+'，等緊 SHK 處理。處理好之後，請用新號碼去「登記 / 啟用帳戶」重新設定密碼。</div>';
  h+='<form id="phf"><label for="np">新 WhatsApp 號碼 <span>New number</span></label><input id="np" type="tel" inputmode="tel" placeholder="07… 或 852…" required>';
  h+='<p class="small" style="margin-top:6px">因為電話號碼係登入號碼，改號碼要 SHK 幫你轉。轉好之後，你嘅時數同紀錄會跟住過去。<br>Your phone is your login, so SHK moves your account to the new number for you. Your hours move with it.</p>';
  h+=msg("phone")+'<button class="btn ghost" type="submit"'+(busy==="phone"?" disabled":"")+'>申請改號碼 Request change</button></form></div>';
  return h;
}
function passwordCard(){
  let h='<div class="card"><h2>改密碼 Change password</h2><form id="pwf">';
  h+='<label for="cp">而家嘅密碼 <span>Current password</span></label><input id="cp" type="password" autocomplete="current-password" required>';
  h+='<label for="p1">新密碼 <span>New password, at least 8 characters</span></label><input id="p1" type="password" autocomplete="new-password" minlength="8" required>';
  h+='<label for="p2">再輸入一次 <span>Repeat new password</span></label><input id="p2" type="password" autocomplete="new-password" minlength="8" required>';
  h+=msg("password")+'<button class="btn ghost" type="submit"'+(busy==="password"?" disabled":"")+'>'+(busy==="password"?"更改中…":"更改密碼 Change password")+'</button></form></div>';
  return h;
}
function render(){
  $("#out").hidden=!user;
  if(!ready)return;
  if(!user){$("#app").innerHTML=loginCard();return;}
  if(!me){$("#app").innerHTML='<div class="card"><h2>帳戶未完成登記</h2><p>請去 <a href="/volunteer/join/">登記頁</a> 完成。</p></div>';return;}
  let h='<div class="card"><h1>你好，'+esc(me.name)+'</h1>';
  if(me.status==="pending")h+='<div class="note" style="margin-top:8px">已收到你嘅登記，等待 SHK 批核。<br><span class="small">Waiting for approval.</span></div>';
  else if(me.status==="disabled")h+='<div class="note" style="margin-top:8px">帳戶已停用，如有疑問請聯絡 SHK。</div>';
  else h+='<p>活動現場掃描 QR code 打卡。<span class="small"> Scan the event QR code to check in.</span></p>';
  h+='</div>';
  $("#app").innerHTML=h+hoursCard()+certCard()+sessionsCard()+profileCard()+phoneCard()+passwordCard();
}
async function load(){
  me=null;H=null;pid=null;
  if(!user)return;
  try{pid=(await db.ref("shk/uids/"+user.uid).get()).val();}catch(e){}
  if(!pid)return;
  try{me=(await db.ref("shk/people/"+pid).get()).val();}catch(e){}
}
async function loadHours(){
  try{H=await S.volunteerHours(db,pid);}catch(e){H={minutes:0,count:0,sessions:[],open:null};}
  render();
}
auth.onAuthStateChanged(async u=>{
  if(u&&u.isAnonymous){await auth.signOut();return;}
  user=u;err={};ok={};await load();ready=true;render();
  if(me)loadHours();
});
document.addEventListener("submit",async e=>{
  const id=e.target.id;e.preventDefault();err={};ok={};
  if(id==="lf"){
    const ph=$("#ph").value,pw=$("#pw").value;busy="login";render();
    try{await S.signInPhone(auth,db,ph,pw);}catch(x){err.login=S.authErrorText(x,false);}
    busy="";render();return;
  }
  if(id==="pf"){
    const v={name:$("#nm").value.trim(),email:$("#em").value.trim()};
    if(!me.cert){v.first=$("#fn").value.trim();v.surname=$("#sn").value.trim();}
    if(!v.name){err.profile="請填寫登記名字。";render();return;}
    busy="profile";render();
    try{await db.ref("shk/people/"+pid).update(v);Object.assign(me,v);ok.profile="已儲存 ✓ Saved";}
    catch(x){err.profile="儲存唔到，請再試。Could not save, please try again.";}
    busy="";render();return;
  }
  if(id==="phf"){
    const np=S.normPhone($("#np").value);
    if(!np){err.phone="請輸入正確嘅 WhatsApp 號碼。";render();return;}
    if(np===pid){err.phone="呢個就係你而家嘅號碼。";render();return;}
    busy="phone";render();
    try{
      const taken=(await db.ref("shk/directory/"+np).get()).val();
      if(taken){err.phone="呢個號碼已經有 SHK 帳戶，請聯絡 SHK。";}
      else{const r={phone:np,at:firebase.database.ServerValue.TIMESTAMP};await db.ref("shk/people/"+pid+"/phoneRequest").set(r);me.phoneRequest={phone:np};ok.phone="已送出申請 ✓ SHK 處理好會通知你。";}
    }catch(x){err.phone="送出唔到，請再試。";}
    busy="";render();return;
  }
  if(id==="pwf"){
    const cp=$("#cp").value,p1=$("#p1").value,p2=$("#p2").value;
    if(p1.length<8){err.password="新密碼最少 8 個字。";render();return;}
    if(p1!==p2){err.password="兩次輸入嘅新密碼唔一樣。";render();return;}
    busy="password";render();
    try{
      await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email,cp));
      await user.updatePassword(p1);ok.password="密碼已更改 ✓ 下次登入用新密碼。";
    }catch(x){
      const c=(x&&x.code)||"";
      err.password=(c==="auth/wrong-password"||c==="auth/invalid-credential"||c==="auth/invalid-login-credentials")?"而家嘅密碼唔啱。":c==="auth/too-many-requests"?"試錯太多次，請等幾分鐘再試。":c==="auth/weak-password"?"新密碼太簡單。":"更改唔到，請再試。";
    }
    busy="";render();return;
  }
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.act==="logout")await auth.signOut();
});
})();
</script>
</body>
</html>
