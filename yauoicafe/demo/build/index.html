<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>友愛冰室 · 砌你嘅全日早餐（試玩）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Noto+Sans+HK:wght@500;700;900&family=Noto+Serif+HK:wght@900&display=swap">
<style>
/* the scene: looking straight down at a cha chaan teng table — mint formica, green-rim melamine */
:root{--green:#0F6B3A;--red:#D62828;--gold:#FFC83D;--paper:#FFF7E1;--ink:#1F1A17;--table:#BFE0C8;--muted:#4B5A50;
  --zh:"Noto Serif HK","Songti TC",serif;--en:"Bowlby One",Impact,sans-serif;--body:"Noto Sans HK","PingFang HK",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.top{background:var(--green);color:var(--paper)}
.top .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{height:40px;border-radius:4px;display:block}
.top h1{margin:0;font:900 20px/1.2 var(--zh)}
.lang{margin-left:auto;border:2px solid currentColor;background:transparent;color:inherit;font:700 15px var(--body);border-radius:10px;padding:6px 12px;min-height:40px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0}
.table{position:relative;background:var(--table);
  background-image:radial-gradient(rgba(255,255,255,.55) 1px,transparent 1.5px),radial-gradient(rgba(15,107,58,.18) 1px,transparent 1.5px);
  background-size:13px 13px,17px 17px;background-position:0 0,6px 9px;padding:10px 6px 0}
.table svg{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
.price{position:absolute;left:12px;bottom:14px;z-index:1;background:var(--gold);color:var(--ink);font:400 26px/1 var(--en);padding:9px 13px 7px;border-radius:6px;transform:rotate(3deg);box-shadow:3px 3px 0 rgba(0,0,0,.2)}
.panel{padding:16px 16px 120px}
ol.steps{display:flex;gap:6px;margin:0 0 14px;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none}
ol.steps li{flex:none}
ol.steps button{border:0;background:#EADFC8;color:var(--muted);border-radius:999px;padding:6px 12px;font:700 14px var(--body);min-height:36px}
ol.steps button[aria-current="step"]{background:var(--green);color:var(--paper)}
ol.steps button.done{background:#CFE6D6;color:var(--green)}
h2{font:900 clamp(26px,6.5vw,36px)/1.15 var(--zh);margin:0 0 4px;color:var(--green)}
.hint{margin:0 0 14px;color:var(--muted);font-size:15px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2.5px solid #E2D6BD;background:#fff;border-radius:14px;padding:10px 12px;min-height:60px;font:900 18px/1.2 var(--body);color:var(--ink)}
.opt small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--green);background:#E6F2EA}
.opt:disabled{opacity:.4}
.opt .n{margin-left:auto;background:var(--green);color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.seg{display:inline-flex;background:#EADFC8;border-radius:12px;padding:4px;margin:0 0 12px}
.seg button{border:0;background:transparent;font:900 16px var(--body);padding:8px 16px;border-radius:9px;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:2px solid #EADFC8;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:1100px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:14px;font:900 18px var(--body);padding:14px 18px;min-height:54px}
.btn.back{background:#EADFC8;color:var(--ink)}
.btn.go{flex:1;background:var(--red);color:#fff;box-shadow:0 4px 0 #9E1B1B}
.btn.go:disabled{background:#C9BFAE;box-shadow:none}
.sum{background:#fff;border:2.5px solid var(--green);border-radius:14px;padding:14px 16px}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.sum dt{color:var(--muted);font-weight:700}.sum dd{margin:0;font-weight:900}
.sum .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed #E2D6BD;margin-top:10px;padding-top:10px;font:900 20px var(--body)}
.sum .tot b{font:400 30px var(--en)}
.al{margin:10px 0 0;font-size:14px;color:var(--red);font-weight:700}
.note{margin:12px 0 0;font-size:14px;color:var(--muted)}
/* things landing on the table */
.drop{animation:drop .38s cubic-bezier(.2,.9,.3,1.25) both;transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:translateY(-26px) scale(1.25);opacity:0}to{transform:none;opacity:1}}
.steam path{stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round;opacity:0;animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.5s}.steam path:nth-child(3){animation-delay:1s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.85}100%{opacity:0;transform:translateY(-22px)}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(min-width:860px){
  .wrap{grid-template-columns:1.1fr 1fr;align-items:start}
  .table{position:sticky;top:0;min-height:calc(100vh - 150px);display:flex;align-items:center;padding:24px}
  .panel{padding:28px 28px 120px}
}
@media(prefers-reduced-motion:reduce){.drop,.steam path{animation:none}.steam path{opacity:.6}}
html:not([lang="en"]) [data-l="en"],html[lang="en"] [data-l="zh"]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="/yauoicafe/"><img src="/yauoicafe/assets/yau-oi-logo-320.jpg" alt="友愛冰室 Yau Oi Cafe" width="112" height="55"></a>
  <h1><span data-l="zh">砌你嘅全日早餐</span><span data-l="en">Build your All Day Set</span></h1>
  <button class="lang" id="lang" type="button">EN</button>
</div></header>
<div class="wrap">
  <div class="table">
    <span class="price" id="price">£9.50</span>
    <svg id="scene" viewBox="0 0 420 430" role="img" aria-label="你嘅全日早餐 Your All Day Set"></svg>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
</div>
<nav class="nav"><div class="in"><button class="btn back" id="back" type="button"></button><button class="btn go" id="go" type="button"></button></div></nav>
<script src="/yauoicafe/order/menu.js"></script>
<script>
(function(){
const Y=window.YO,G=Y.G,h=document.documentElement,$=id=>document.getElementById(id);
let P={},lang="zh";try{lang=localStorage.getItem("shk_lang")==="en"?"en":"zh";}catch(e){}
const EN=()=>lang==="en",t=(z,e)=>EN()?e:z,nm=o=>EN()?o.en:o.zh,money=p=>"£"+(p/100).toFixed(2);
const MAINS=Y.MENU.filter(m=>m.cat==="allday");
const S={step:0,main:null,noodle:null,sides:[],toast:false,hot:true,drink:null,last:null};
const STEPS=[["麵","Noodles"],["主菜","Main"],["跟配","Sides"],["多士","Toast"],["飲品","Drink"],["上枱","Serve"]];
const off=(g,c)=>!!(P.off&&P.off["opt:"+g+":"+c]);
/* ---------- drawing (all shapes are simple flat illustrations, seeded so they stay put) ---------- */
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const NS="http://www.w3.org/2000/svg";
const BOWL={x:170,y:268,r:140},PLATE={x:318,y:118,r:92},CUP={x:84,y:84};
function rim(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r-7}" fill="none" stroke="#0F6B3A" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r-13}" fill="none" stroke="#0F6B3A" stroke-width="1.6"/><circle cx="${x}" cy="${y}" r="${r-22}" fill="#FBFAF4"/>`;}
function noodles(id){seed=11;const {x,y}=BOWL;let s="";const N=id==="macaroni"?70:id==="instant"?48:40;
  for(let k=0;k<N;k++){const a=rnd()*6.283,d=Math.sqrt(rnd())*92,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d,rot=rnd()*360;
    if(id==="macaroni")s+=`<path d="M${px-7} ${py} a7 7 0 1 1 14 0" transform="rotate(${rot} ${px} ${py})" fill="none" stroke="#EDC35E" stroke-width="6.5" stroke-linecap="round"/><path d="M${px-7} ${py} a7 7 0 1 1 14 0" transform="rotate(${rot} ${px} ${py})" fill="none" stroke="#FBE7A6" stroke-width="2" stroke-linecap="round"/>`;
    else if(id==="instant")s+=`<path d="M${px-18} ${py} q4.5 -7 9 0 t9 0 t9 0 t9 0" transform="rotate(${rot} ${px} ${py})" fill="none" stroke="#E2BE62" stroke-width="4.4" stroke-linecap="round"/>`;
    else if(id==="rice")s+=`<path d="M${px-30} ${py} q15 ${-12+rnd()*24} 30 0 t30 0" transform="rotate(${rot} ${px} ${py})" fill="none" stroke="#FFFDF3" stroke-width="2.4" stroke-linecap="round"/>`;
    else s+=`<path d="M${px-30} ${py} q15 ${-14+rnd()*28} 30 0 t30 0" transform="rotate(${rot} ${px} ${py})" fill="none" stroke="#EBC56A" stroke-width="4.6" stroke-linecap="round"/>`;}
  return s;}
function topping(id){seed=23;const {x,y}=BOWL;let s="";
  if(id==="ad_satay"){for(let k=0;k<9;k++){const px=x-30+rnd()*60,py=y-30+rnd()*55;s+=`<path d="M${px} ${py} c12 -10 30 -4 28 8 c-2 12 -22 16 -30 8 z" transform="rotate(${rnd()*360} ${px} ${py})" fill="#6E3A1E"/>`;}
    for(let k=0;k<26;k++){const px=x-26+rnd()*52,py=y-24+rnd()*44;s+=`<rect x="${px}" y="${py}" width="5" height="2.4" rx="1" fill="#D9A35A" transform="rotate(${rnd()*180} ${px} ${py})"/>`;}}
  else if(id==="ad_ham"){for(let k=0;k<14;k++){const px=x-34+rnd()*68,py=y-30+rnd()*60;s+=`<rect x="${px}" y="${py}" width="30" height="7" rx="3" fill="#F2A7B0" stroke="#E68C98" stroke-width="1.2" transform="rotate(${rnd()*180} ${px} ${py})"/>`;}}
  else if(id==="ad_bbq"){for(let k=0;k<6;k++){const px=x-36+(k%3)*26,py=y-26+Math.floor(k/3)*30;s+=`<g transform="rotate(${-20+rnd()*40} ${px+14} ${py+10})"><rect x="${px}" y="${py}" width="34" height="22" rx="4" fill="#B8402A"/><rect x="${px+4}" y="${py+4}" width="26" height="14" rx="3" fill="#E9A182"/></g>`;}}
  else{for(let k=0;k<16;k++){const px=x-30+rnd()*60,py=y-26+rnd()*52;s+=`<rect x="${px}" y="${py}" width="15" height="13" rx="3.5" fill="#8A4B24" stroke="#6A3517" stroke-width="1.2" transform="rotate(${rnd()*90} ${px} ${py})"/>`;}}
  return s;}
function side(id,cx,cy){
  if(id==="sausage")return `<g transform="rotate(-25 ${cx} ${cy})"><rect x="${cx-34}" y="${cy-11}" width="68" height="22" rx="11" fill="#B3502C"/><rect x="${cx-28}" y="${cy-7}" width="40" height="5" rx="2.5" fill="#D9825C"/><path d="M${cx-14} ${cy+11} l5 -22 M${cx+4} ${cy+11} l5 -22" stroke="#8C3A1C" stroke-width="2"/></g>`;
  if(id==="luncheon")return `<g><rect x="${cx-30}" y="${cy-22}" width="52" height="36" rx="6" fill="#E8907F" transform="rotate(-12 ${cx} ${cy})"/><rect x="${cx-20}" y="${cy-12}" width="52" height="36" rx="6" fill="#F0A595" stroke="#D97B6A" stroke-width="1.5" transform="rotate(8 ${cx} ${cy})"/><circle cx="${cx}" cy="${cy}" r="1.6" fill="#fff"/><circle cx="${cx+12}" cy="${cy+8}" r="1.4" fill="#fff"/></g>`;
  const white=`<path d="M${cx-34} ${cy-6} c4 -26 40 -32 58 -14 c16 14 6 40 -16 42 c-20 4 -46 -6 -42 -28 z" fill="#FFFFFF" stroke="#EDE6D6" stroke-width="1.5"/><path d="M${cx-30} ${cy-4} c2 -6 6 -10 10 -12" stroke="#C88A3C" stroke-width="2.5" fill="none" opacity=".55"/>`;
  if(id==="fried")return white+`<circle cx="${cx-2}" cy="${cy-2}" r="14" fill="#FFB31A"/><circle cx="${cx-6}" cy="${cy-6}" r="4" fill="#FFD36B"/>`;
  if(id==="overhard")return white+`<circle cx="${cx-2}" cy="${cy-2}" r="14" fill="#F1C766"/>`;
  if(id==="overeasy")return white+`<circle cx="${cx-2}" cy="${cy-2}" r="14" fill="#FFC23A" opacity=".55"/><circle cx="${cx-2}" cy="${cy-2}" r="14" fill="#FFFFFF" opacity=".45"/>`;
  return "";}
function scrambled(cx,cy){seed=41;let s=`<path d="M${cx-60} ${cy} c0 -36 50 -50 86 -30 c30 16 26 54 -6 62 c-34 10 -80 4 -80 -32 z" fill="#FFD449"/>`;
  for(let k=0;k<14;k++){const px=cx-44+rnd()*80,py=cy-24+rnd()*46;s+=`<path d="M${px} ${py} q8 -8 16 0" stroke="#F2B728" stroke-width="3" fill="none" stroke-linecap="round"/>`;}return s;}
function toast(cx,cy){return `<g transform="rotate(14 ${cx} ${cy})"><rect x="${cx-34}" y="${cy-32}" width="68" height="64" rx="12" fill="#B9773B"/><rect x="${cx-28}" y="${cy-26}" width="56" height="52" rx="9" fill="#E8B977"/><rect x="${cx-11}" y="${cy-10}" width="22" height="18" rx="4" fill="#FFF0A8" stroke="#F2D66B" stroke-width="1.5"/></g>`;}
const DRINK={hkcoffee:"#3E2416",milktea:"#B9804F",yuanyang:"#94603A",lemontea:"#A0521C",lemonwater:"#F3E6A6",ovaltine:"#B48558",choc:"#5A321E"};
function drink(id,hot){if(!id)return "";const k=id.replace(/^(hot|iced)_/,""),c=DRINK[k]||"#B9804F",{x,y}=CUP,lemon=/lemon/.test(k);
  if(hot)return `<g class="${S.last==='drink'?'drop':''}"><circle cx="${x}" cy="${y}" r="56" fill="#fff" stroke="#E3DDCF" stroke-width="2"/><circle cx="${x}" cy="${y}" r="50" fill="none" stroke="#C0392B" stroke-width="2"/><rect x="${x+34}" y="${y-9}" width="30" height="18" rx="9" fill="#fff" stroke="#E3DDCF" stroke-width="2"/><circle cx="${x}" cy="${y}" r="40" fill="#fff" stroke="#E3DDCF" stroke-width="2"/><circle cx="${x}" cy="${y}" r="33" fill="${c}"/>${lemon?`<circle cx="${x-6}" cy="${y-4}" r="13" fill="#FFE45C" stroke="#F2C200" stroke-width="2"/><path d="M${x-6} ${y-17} v26 M${x-19} ${y-4} h26" stroke="#F2C200" stroke-width="1.5"/>`:`<ellipse cx="${x-10}" cy="${y-10}" rx="10" ry="5" fill="#fff" opacity=".25"/>`}</g>`;
  seed=53;let ice="";for(let i=0;i<4;i++){const px=x-18+rnd()*24,py=y-18+rnd()*24;ice+=`<rect x="${px}" y="${py}" width="15" height="15" rx="3" fill="#fff" opacity=".55" transform="rotate(${rnd()*60} ${px} ${py})"/>`;}
  return `<g class="${S.last==='drink'?'drop':''}"><circle cx="${x}" cy="${y}" r="44" fill="#EAF4F7" stroke="#C9DDE3" stroke-width="3"/><circle cx="${x}" cy="${y}" r="37" fill="${c}"/>${ice}${lemon?`<circle cx="${x+8}" cy="${y+6}" r="12" fill="#FFE45C" stroke="#F2C200" stroke-width="2"/>`:""}<line x1="${x+4}" y1="${y-6}" x2="${x+46}" y2="${y-50}" stroke="#1F1A17" stroke-width="6" stroke-linecap="round"/></g>`;}
function scene(){const sv=$("scene"),L=S.last;let s=`<defs><radialGradient id="soup" r=".6"><stop offset="0" stop-color="#F7E7C0"/><stop offset="1" stop-color="#EAD39E"/></radialGradient></defs>`;
  s+=`<ellipse cx="${BOWL.x+6}" cy="${BOWL.y+10}" rx="${BOWL.r}" ry="${BOWL.r}" fill="#0F6B3A" opacity=".12"/>`+rim(BOWL.x,BOWL.y,BOWL.r)+`<circle cx="${BOWL.x}" cy="${BOWL.y}" r="${BOWL.r-30}" fill="url(#soup)"/>`;
  if(S.noodle)s+=`<g class="${L==="noodle"?"drop":""}">${noodles(S.noodle)}</g>`;
  if(S.main)s+=`<g class="${L==="main"?"drop":""}">${topping(S.main)}</g>`;
  s+=`<ellipse cx="${PLATE.x+5}" cy="${PLATE.y+8}" rx="${PLATE.r}" ry="${PLATE.r}" fill="#0F6B3A" opacity=".12"/>`+rim(PLATE.x,PLATE.y,PLATE.r);
  if(S.sides[0]==="scrambled")s+=`<g class="${L==="sides"?"drop":""}">${scrambled(PLATE.x-6,PLATE.y+4)}</g>`;
  else S.sides.forEach((c,k)=>{s+=`<g class="${L==="sides"&&k===S.sides.length-1?"drop":""}">${side(c,PLATE.x+(k?26:-30),PLATE.y+(k?26:-24))}</g>`;});
  if(S.toast)s+=`<g class="${L==="toast"?"drop":""}">${toast(PLATE.x+44,PLATE.y-40)}</g>`;
  s+=drink(S.drink,S.hot);
  if(S.step===5)s+=`<g class="steam"><path d="M${BOWL.x-30} ${BOWL.y-70} q-12 -16 0 -32 t0 -32"/><path d="M${BOWL.x} ${BOWL.y-80} q-12 -16 0 -32 t0 -32"/><path d="M${BOWL.x+30} ${BOWL.y-70} q-12 -16 0 -32 t0 -32"/></g>`;
  sv.innerHTML=s;S.last=null;}
/* ---------- pricing straight from the real menu ---------- */
function sel(){return {noodle:S.noodle?[S.noodle]:[],sides:S.sides.slice(),toast:S.toast?["toast"]:[],setdrink:S.drink?[S.drink]:[]};}
function price(){const m=S.main||MAINS[0].id;const ln=Y.mkLine(m,1,sel(),P);return ln?ln.unit:0;}
const used=()=>Y.selCount(G.sides,S.sides);
/* ---------- panel ---------- */
function opt(act,v,label,sub,pressed,dis,n){return `<button class="opt" type="button" data-a="${act}" data-v="${v}" aria-pressed="${!!pressed}"${dis?" disabled":""}><span>${label}${sub?`<small>${sub}</small>`:""}</span>${n?`<span class="n">×${n}</span>`:""}</button>`;}
function panel(){const st=S.step;let h=`<ol class="steps">`+STEPS.map((s,k)=>`<li><button type="button" data-a="jump" data-v="${k}"${k===st?' aria-current="step"':''} class="${k<st?"done":""}"${k>maxStep()?" disabled":""}>${k+1}. ${t(s[0],s[1])}</button></li>`).join("")+`</ol>`;
  if(st===0){h+=`<h2>${t("揀麵","Choose your noodles")}</h2><p class="hint">${t("湯底一碗，揀一款麵。","One bowl of soup — pick the noodles.")}</p><div class="opts">`+G.noodle.choices.map(c=>opt("noodle",c.id,nm(c),"",S.noodle===c.id,off("noodle",c.id))).join("")+`</div>`;}
  if(st===1){h+=`<h2>${t("揀主菜","Choose the main")}</h2><p class="hint">${t("放喺麵上面。","It goes on top of the noodles.")}</p><div class="opts">`+MAINS.map(m=>opt("main",m.id,Y.itemName(m,P,lang),money(Y.itemPrice(m,P,false)),S.main===m.id,P.off&&P.off[m.id])).join("")+`</div>`;}
  if(st===2){const u=used();h+=`<h2>${t("揀兩款跟配","Pick two sides")}</h2><p class="hint">${t("同一款撳兩下＝雙份。炒蛋用兩隻蛋炒，一款已經夠兩份。再撳一次已揀嘅就會減返。","Tap a side twice for a double. Scrambled egg uses two eggs, so it counts as both sides. Tap again to take one off.")} <b>${u}/2</b></p><div class="opts">`+G.sides.choices.map(c=>{const n=S.sides.filter(x=>x===c.id).length,w=c.w||1;return opt("side",c.id,nm(c),w>1?t("算兩款","counts as two"):"",n>0,off("sides",c.id)||(!n&&u+w>2),n);}).join("")+`</div>`;}
  if(st===3){const tc=G.toast.choices[0];h+=`<h2>${t("要唔要多士？","Add toast?")}</h2><p class="hint">${t("牛油多士，另加 ","Buttered toast, ")+money(Y.choicePrice("toast",tc,P))+t("。"," extra.")}</p><div class="opts">`+opt("toast","1",nm(tc),"+"+money(Y.choicePrice("toast",tc,P)),S.toast)+opt("toast","0",t("唔使喇","No thanks"),"",!S.toast)+`</div>`;}
  if(st===4){const list=G.setdrink.choices.filter(c=>c.id.startsWith(S.hot?"hot_":"iced_"));h+=`<h2>${t("揀飲品","Choose a drink")}</h2><div class="seg"><button type="button" data-a="hot" data-v="1" aria-pressed="${S.hot}">${t("熱","Hot")}</button><button type="button" data-a="hot" data-v="0" aria-pressed="${!S.hot}">${t("凍 +","Iced +")}${money(Y.choicePrice("setdrink",G.setdrink.choices.find(c=>c.id.startsWith("iced_")),P))}</button></div><div class="opts">`+list.map(c=>opt("drink",c.id,nm(c),"",S.drink===c.id,off("setdrink",c.id))).join("")+`</div>`;}
  if(st===5){const m=Y.byId[S.main],ln=Y.mkLine(S.main,1,sel(),P),al=Y.lineAllergens(S.main,sel());
    h+=`<h2>${t("上枱！","Here it comes!")}</h2><div class="sum"><dl><dt>${t("主菜","Main")}</dt><dd>${Y.itemName(m,P,lang)}</dd>`+ln.desc.map(d=>`<dt>${{noodle:t("麵","Noodles"),sides:t("跟配","Sides"),toast:t("多士","Toast"),setdrink:t("飲品","Drink")}[d.g]||""}</dt><dd>${EN()?d.en:d.zh}${d.p?" +"+money(d.p):""}</dd>`).join("")+`</dl><div class="tot"><span>${t("合共","Total")}</span><b>${money(ln.unit)}</b></div>`+(al.length?`<p class="al">${t("含：","Contains: ")}${al.map(c=>Y.alName(c,lang)).join(t("、",", "))}</p>`:"")+`</div><p class="note">${t("呢個係試玩版。想食就掃枱上 QR code，喺「全日早餐」揀返同一樣。","This is a preview. To order, scan the QR code on your table and choose the same in All Day Set.")}</p>`;}
  $("panel").innerHTML=h;
  $("back").textContent=st?t("上一步","Back"):t("睇餐牌相","Browse photos");
  $("go").textContent=st===5?t("再砌一份","Build another"):st===4?t("上枱","Serve it"):t("下一步","Next");
  $("go").disabled=!ready(st);
  $("price").textContent=money(price());}
function ready(st){return st===0?!!S.noodle:st===1?!!S.main:st===2?used()===2:st===3?true:st===4?!!S.drink:true;}
function maxStep(){let k=0;while(k<5&&ready(k))k++;return k;}
function render(){scene();panel();}
$("panel").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="jump"){S.step=+v;}
  if(a==="noodle"){S.noodle=v;S.last="noodle";}
  if(a==="main"){S.main=v;S.last="main";}
  if(a==="side"){const c=G.sides.choices.find(x=>x.id===v),n=S.sides.filter(x=>x===v).length;
    if(n&&(used()+(c.w||1)>2||!G.sides.dup)){S.sides.splice(S.sides.lastIndexOf(v),1);}
    else if(used()+(c.w||1)<=2){S.sides.push(v);S.last="sides";}}
  if(a==="toast"){S.toast=v==="1";if(S.toast)S.last="toast";}
  if(a==="hot"){S.hot=v==="1";if(S.drink){const k=S.drink.replace(/^(hot|iced)_/,"");S.drink=(S.hot?"hot_":"iced_")+k;S.last="drink";}}
  if(a==="drink"){S.drink=v;S.last="drink";}
  render();});
$("go").onclick=()=>{if(S.step===5){Object.assign(S,{step:0,main:null,noodle:null,sides:[],toast:false,hot:true,drink:null});}else if(ready(S.step))S.step++;render();scrollTo({top:0,behavior:"smooth"});};
$("back").onclick=()=>{if(!S.step){location.href="/yauoicafe/demo/showcase/";return;}S.step--;render();};
function setLang(l){lang=l;h.lang=l==="en"?"en":"zh-Hant";$("lang").textContent=l==="en"?"中文":"EN";try{localStorage.setItem("shk_lang",l);}catch(e){}render();}
$("lang").onclick=()=>setLang(EN()?"zh":"en");
setLang(lang);
fetch(Y.FIREBASE.databaseURL+"/ordering/public.json").then(r=>r.json()).then(p=>{P=p||{};render();}).catch(()=>{});
})();
</script>
</body>
