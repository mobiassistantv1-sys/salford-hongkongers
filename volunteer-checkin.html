<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C00878">
<title>義工打卡 | Salford Hongkongers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5efe3;--ink-2:#fcf8f0;--line-2:rgba(60,45,30,.24);--cream:#2b2521;--muted:#6b6258;--faint:#978d7f;--rose:#C00878;--gold:#a9790f;--ok:#0b7d69;--field:#fffdf9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:"Noto Sans TC","PingFang HK",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:460px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2{font-family:"Noto Serif TC",serif;font-weight:900}
a{color:inherit}
header{border-bottom:1px solid rgba(60,45,30,.14)}
.nav{height:60px;display:flex;align-items:center;gap:11px}
.nav img{height:42px;width:auto}
.wm b{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;display:block;line-height:1.05}
.wm .mg{color:var(--rose)}.wm .gd{color:var(--gold)}.wm small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.1em}
.logout{margin-left:auto;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line-2);border-radius:9px;padding:6px 12px;cursor:pointer;font-family:inherit}
main{flex:1;display:flex;align-items:center;padding:30px 0}
.card{width:100%;text-align:center}
.eyebrow{font-size:13px;color:var(--rose);font-weight:700;margin-bottom:10px}
.evt{font-size:clamp(1.6rem,6vw,2rem)}
.evt small{display:block;font-size:14px;color:var(--muted);font-weight:400;font-family:"Noto Sans TC",sans-serif;margin-top:8px}
.hi{color:var(--muted);margin:18px 0 6px}
.status{display:inline-block;margin:20px 0;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.status.in{color:var(--ok);border-color:var(--ok)}
.big{width:100%;font-family:inherit;font-size:22px;font-weight:900;color:#fff;border:none;border-radius:16px;padding:26px;cursor:pointer;margin-top:10px}
.big.inbtn{background:var(--ok)}
.big.outbtn{background:var(--rose)}
.big:disabled{opacity:.55}
.sub{color:var(--muted);font-size:14px;margin-top:18px}
.msg{font-size:14px;color:#c0251b;margin-top:14px;min-height:1px}
.center{text-align:center;color:var(--muted);padding:40px 0}
.loginbtn{display:inline-block;margin-top:16px;color:#fff;background:var(--rose);border-radius:12px;padding:13px 22px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap nav">
  <img src="/assets/shk-logo-icon.png" alt="Salford HongKongers CIC">
  <span class="wm"><b><span class="mg">Salford</span> <span class="gd">Hongkongers</span></b><small>義工打卡 Check-in</small></span>
  <button class="logout" id="logout" hidden>登出</button>
</div></header>

<main><div class="wrap card" id="app">
  <p class="center">載入中… Loading…</p>
</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
"use strict";
firebase.initializeApp({apiKey:"AIzaSyBCCnoKm-ypR-3MfzwTRXLd1TTplcqteY8",authDomain:"yauoicafequeue.firebaseapp.com",databaseURL:"https://yauoicafequeue-default-rtdb.europe-west1.firebasedatabase.app",projectId:"yauoicafequeue",storageBucket:"yauoicafequeue.firebasestorage.app",messagingSenderId:"354774084334",appId:"1:354774084334:web:9c8923bd9ece01b45f61ff"});
const auth=firebase.auth(),db=firebase.database();
const app=document.getElementById('app'), logoutBtn=document.getElementById('logout');
const params=new URLSearchParams(location.search), EID=params.get('e')||'', TOK=params.get('t')||'';
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

logoutBtn.addEventListener('click',()=>auth.signOut().then(()=>location.href='/volunteer-login.html'));

auth.onAuthStateChanged(async user=>{
  if(!user||user.isAnonymous){
    const next=encodeURIComponent(location.pathname+location.search);
    app.innerHTML='<div class="eyebrow">義工打卡</div><h2>請先登入</h2><p class="sub">登入後即可喺活動現場打卡。</p><a class="loginbtn" href="/volunteer-login.html?next='+next+'">登入 Log in</a>';
    return;
  }
  logoutBtn.hidden=false;
  if(!EID||!TOK){
    app.innerHTML='<div class="eyebrow">義工打卡</div><h2>請掃描活動 QR 碼</h2><p class="sub">喺活動現場用手機掃描我們提供的 QR 碼，即可打卡。</p>';
    return;
  }
  let evt=null;
  try{ evt=(await db.ref('volunteers/events/'+EID).get()).val(); }catch(e){}
  if(!evt){ app.innerHTML='<h2>活動不存在</h2><p class="sub">請確認 QR 碼是否正確。</p>'; return; }
  if(evt.token!==TOK){ app.innerHTML='<h2>QR 碼無效</h2><p class="sub">這個 QR 碼已失效，請向職員查詢。</p>'; return; }

  let prof=null; try{ prof=(await db.ref('volunteers/profiles/'+user.uid).get()).val(); }catch(e){}
  const nick=prof&&prof.nickname?prof.nickname:'義工';
  const ref=db.ref('volunteers/checkins/'+dayKey()+'/'+user.uid+'/'+EID);
  let rec=null; try{ rec=(await ref.get()).val(); }catch(e){}
  render(evt,nick,ref,rec,user.uid);
});

function render(evt,nick,ref,rec,uid){
  const inDone=rec&&rec.inAt, outDone=rec&&rec.outAt;
  let statusHtml, btnHtml;
  if(!inDone){
    statusHtml='<div class="status">尚未簽到 Not checked in</div>';
    btnHtml='<button class="big inbtn" id="act">簽到 Clock in</button>';
  }else if(!outDone){
    statusHtml='<div class="status in">已簽到 '+hhmm(rec.inAt)+' · 服務中</div>';
    btnHtml='<button class="big outbtn" id="act">簽退 Clock out</button>';
  }else{
    const hrs=((rec.outAt-rec.inAt)/3600000);
    statusHtml='<div class="status">今日已完成 '+hhmm(rec.inAt)+'–'+hhmm(rec.outAt)+' · '+hrs.toFixed(1)+' 小時</div>';
    btnHtml='<p class="sub">多謝你今日的付出！Thank you for today.</p>';
  }
  app.innerHTML='<div class="eyebrow">義工打卡</div>'+
    '<h2 class="evt">'+esc(evt.name||'活動')+(evt.venue?'<small>'+esc(evt.venue)+'</small>':'')+'</h2>'+
    '<p class="hi">你好，'+esc(nick)+'</p>'+statusHtml+'<div>'+btnHtml+'</div><div class="msg" id="msg"></div>';
  const act=document.getElementById('act');
  if(act) act.addEventListener('click',()=>punch(evt,nick,ref,rec,uid,inDone));
}

async function punch(evt,nick,ref,rec,uid,inDone){
  const btn=document.getElementById('act'), msg=document.getElementById('msg');
  btn.disabled=true; btn.textContent='處理中…';
  try{
    if(!inDone){
      await ref.set({event:EID,token:TOK,nick:nick,inAt:firebase.database.ServerValue.TIMESTAMP});
    }else{
      await ref.update({outAt:firebase.database.ServerValue.TIMESTAMP});
    }
    const fresh=(await ref.get()).val();
    render(evt,nick,ref,fresh,uid);
  }catch(ex){
    btn.disabled=false; btn.textContent=inDone?'簽退 Clock out':'簽到 Clock in';
    msg.textContent='打卡失敗：'+(ex.message||ex.code||'請再試一次');
  }
}
</script>
</body>
</html>
