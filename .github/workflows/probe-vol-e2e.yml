name: Volunteer account e2e (temporary)
on:
  push:
    branches: [probe/vol-e2e]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm i -g firebase-tools@13 && npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && (python3 -m http.server 8080 >/dev/null 2>&1 &) && firebase emulators:exec --project yauoicafequeue --only auth,database "node tests-e2e/e2e.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: shots, path: shots }
