name: Sync Facebook posts to website

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */3 * * *" # every 3 hours

permissions:
  contents: write

concurrency:
  group: fb-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/sync-fb-feed.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Commit feed if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/fb-feed.json)" ]; then echo "No change"; exit 0; fi
          git config user.name "shk-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fb-feed.json
          git commit -m "Update Facebook feed"
          git push
