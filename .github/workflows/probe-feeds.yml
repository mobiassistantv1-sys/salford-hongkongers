name: Probe community feeds (temporary)
on:
  push:
    branches: [probe/feeds]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node scripts/sync-community.mjs && echo "JSONSTART" && cat data/community.json
