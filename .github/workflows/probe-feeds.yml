name: Probe community feeds (temporary)
on:
  push:
    branches: [probe/feeds]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in "https://www.salford.gov.uk/" "https://www.salfordcvs.co.uk/" "https://www.citizensadvicesalford.org.uk/" "https://www.citizensadvice.org.uk/" "https://www.gov.uk/guidance/hong-kong-uk-welcome-programme" "https://www.gov.uk/british-national-overseas-bno-visa" "https://www.report-it.org.uk/" "https://www.salford.gov.uk/contact-us" "https://www.salford.gov.uk/council-tax" "https://www.salford.gov.uk/bins-and-recycling" "https://www.salford.gov.uk/bins" "https://www.salford.gov.uk/housing" "https://www.salford.gov.uk/housing/homelessness" "https://www.salfordhomesearch.co.uk/" "https://england.shelter.org.uk/" "https://www.gov.uk/tenancy-deposit-protection" "https://findajob.dwp.gov.uk/" "https://nationalcareers.service.gov.uk/" "https://www.salford.gov.uk/jobs" "https://www.salford.gov.uk/adult-learning" "https://www.salfordcvs.co.uk/jobs" "https://www.gov.uk/contact-jobcentre-plus" "https://www.salford.gov.uk/schools-and-education" "https://www.salford.gov.uk/school-admissions" "https://www.childcarechoices.gov.uk/" "https://www.salfordcc.ac.uk/" "https://www.salford.ac.uk/" "https://salfordcommunityleisure.co.uk/our-libraries" "https://salfordcommunityleisure.co.uk/whats-on" "https://salfordmuseum.com/" "https://ordsallhall.com/" "https://www.thelowry.com/" "https://news.salford.gov.uk/salford100" "https://www.nhs.uk/nhs-services/gps/how-to-register-with-a-gp-surgery/" "https://111.nhs.uk/" "https://www.samaritans.org/" "https://giveusashout.org/" "https://www.nationaldahelpline.org.uk/" "https://www.metoffice.gov.uk/weather/warnings-and-advice/uk-warnings" "https://tfgm.com/" "https://www.salford.gov.uk/esol" "https://www.salford.gov.uk/cost-of-living"; do
            r=$(curl -sS -L -m 20 -A "$UA" -o f -w "%{http_code} %{url_effective}" "$u" 2>&1 | tail -1)
            t=$(grep -o -m1 '<title>[^<]*' f | head -1 | cut -c8-90)
            echo "LINK $u => $r | $t"
          done
