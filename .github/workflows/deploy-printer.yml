name: Deploy printer server (CloudPRNT)

# Deploys ONLY Cloud Functions (--only functions). Database rules and the website are never touched.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["functions/**", "yauoicafe/order/menu.js", "firebase.json"]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Slips use the same menu as the website
      - run: cp yauoicafe/order/menu.js functions/menu.js
      # MAC from the self-test print (5 Nov 2026). A repo variable PRINTER_MAC overrides it.
      - run: |
          echo "PRINTER_MAC=${{ vars.PRINTER_MAC || '00:11:62:37:10:dd' }}" > functions/.env
          if [ -n "$PRINTER_KEY" ]; then echo "PRINTER_KEY=$PRINTER_KEY" >> functions/.env; fi
        env:
          PRINTER_KEY: ${{ secrets.PRINTER_KEY }}
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: npm test
        working-directory: functions
      # Keyless Google sign-in (Workload Identity Federation): the org policy forbids service-account keys.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/354774084334/locations/global/workloadIdentityPools/github/providers/salford-hongkongers
          service_account: github-actions@yauoicafequeue.iam.gserviceaccount.com
      - name: Deploy
        run: |
          npx --yes firebase-tools@15.36.0 deploy --only functions --project yauoicafequeue --non-interactive --force
