name: Sync Square prices to QR menu

on:
  workflow_dispatch: {}
  schedule:
    # Every 30 minutes, 07:00–14:30 UTC, Friday–Sunday (opening days)
    - cron: "*/30 7-14 * * 5,6,0"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12.7.0
      - run: node scripts/sync-square-prices.mjs
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
