<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C00878">
<title>義工登入 | Salford Hongkongers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#f5efe3;--ink-2:#fcf8f0;--line-2:rgba(60,45,30,.24);--cream:#2b2521;--muted:#6b6258;--faint:#978d7f;--rose:#C00878;--gold:#a9790f;--rose-soft:rgba(192,8,120,.08);--field:#fffdf9}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--cream);font-family:"Noto Sans TC","PingFang HK",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:440px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1{font-family:"Noto Serif TC",serif;font-weight:900}
a{color:inherit}
header{border-bottom:1px solid rgba(60,45,30,.14)}
.nav{height:60px;display:flex;align-items:center;gap:11px}
.nav img{height:42px;width:auto}
.wm b{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;display:block;line-height:1.05}
.wm .mg{color:var(--rose)}.wm .gd{color:var(--gold)}.wm small{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.1em}
main{flex:1;display:flex;align-items:center;padding:30px 0}
.card{width:100%}
.eyebrow{font-size:13px;color:var(--rose);font-weight:700;margin-bottom:10px}
h1{font-size:clamp(1.7rem,6vw,2.2rem)}
.sub{color:var(--muted);margin:12px 0 26px}
form{display:flex;flex-direction:column;gap:17px}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:14.5px;font-weight:700}
input,select{font-family:inherit;font-size:15px;color:var(--cream);background:var(--field);border:1px solid var(--line-2);border-radius:11px;padding:13px 14px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.phone-row{display:flex;gap:8px}.phone-row .cc{flex:none;width:92px}
.submit{font-family:inherit;font-size:16px;font-weight:700;color:#fff;background:var(--rose);border:none;border-radius:12px;padding:15px 22px;cursor:pointer;margin-top:4px}
.submit:disabled{opacity:.6}
.msg{font-size:13.5px;color:#c0251b;min-height:1px}
.alt{text-align:center;font-size:14px;color:var(--muted);margin-top:4px}
.alt a{color:var(--rose);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap nav">
  <img src="/assets/shk-logo-icon.png" alt="Salford HongKongers CIC">
  <span class="wm"><b><span class="mg">Salford</span> <span class="gd">Hongkongers</span></b><small>Community Interest Company</small></span>
</div></header>

<main><div class="wrap card">
  <div class="eyebrow">義工登入</div>
  <h1>歡迎返嚟</h1>
  <p class="sub">用你報名時的電話同密碼登入。</p>
  <form id="login" novalidate>
    <div class="field">
      <label>電話 Phone</label>
      <div class="phone-row">
        <select class="cc" id="cc" aria-label="國家碼"><option value="+44">+44</option><option value="+852">+852</option></select>
        <input type="tel" id="phone" inputmode="numeric" placeholder="07xxx xxxxxx" autocomplete="username">
      </div>
    </div>
    <div class="field">
      <label>密碼 Password</label>
      <input type="password" id="pw" placeholder="••••••" autocomplete="current-password">
    </div>
    <div class="msg" id="msg"></div>
    <button type="submit" class="submit" id="btn">登入 Log in</button>
    <p class="alt">未有帳戶？<a href="/volunteer-register.html">立即報名做義工</a></p>
  </form>
</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
"use strict";
firebase.initializeApp({apiKey:"AIzaSyBCCnoKm-ypR-3MfzwTRXLd1TTplcqteY8",authDomain:"yauoicafequeue.firebaseapp.com",databaseURL:"https://yauoicafequeue-default-rtdb.europe-west1.firebasedatabase.app",projectId:"yauoicafequeue",storageBucket:"yauoicafequeue.firebasestorage.app",messagingSenderId:"354774084334",appId:"1:354774084334:web:9c8923bd9ece01b45f61ff"});
const auth=firebase.auth();
function normPhone(cc,raw){let d=(raw||'').replace(/\D/g,'').replace(/^0+/,'');let c=(cc||'+44').replace(/\D/g,'');if(d.indexOf(c)===0)d=d.slice(c.length).replace(/^0+/,'');return c+d;}
const synthEmail=p=>p+'@vol.salfordhongkongers.co.uk';
const $=id=>document.getElementById(id), msg=$('msg');

// 若已有 return 參數（由打卡頁轉過嚟），登入後返回該頁
const params=new URLSearchParams(location.search);
const back=params.get('next')||'/volunteer-checkin.html';

$('login').addEventListener('submit',async e=>{
  e.preventDefault(); msg.textContent='';
  const phone=$('phone').value.trim(), pw=$('pw').value, cc=$('cc').value;
  if(!phone){msg.textContent='請輸入電話。';return;}
  if(!pw){msg.textContent='請輸入密碼。';return;}
  $('btn').disabled=true; $('btn').textContent='登入中…';
  try{
    await auth.signInWithEmailAndPassword(synthEmail(normPhone(cc,phone)),pw);
    location.href=back;
  }catch(ex){
    $('btn').disabled=false; $('btn').textContent='登入 Log in';
    if(ex.code==='auth/invalid-credential'||ex.code==='auth/wrong-password'||ex.code==='auth/user-not-found') msg.textContent='電話或密碼不正確。';
    else if(ex.code==='auth/too-many-requests') msg.textContent='嘗試太多次，請稍後再試。';
    else msg.textContent='登入時發生問題：'+(ex.message||ex.code);
  }
});
</script>
</body>
</html>
